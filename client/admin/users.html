<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Manage CampusConnect account roles.">
    <title>Manage users — CampusConnect</title>
    <link rel="stylesheet" href="/css/main.css"><link rel="stylesheet" href="/css/admin.css">
    <script src="/js/admin-client.js" defer></script>
    <script src="/js/pages/admin-users.js" defer></script>
  </head>
  <body>
    <header class="site-header"><a class="brand" href="/"><span class="brand-mark" aria-hidden="true">C</span><span>campus<span class="brand-accent">connect</span></span></a>
      <nav class="site-nav" aria-label="Admin navigation"><a href="/admin/dashboard.html">Overview</a><a href="/admin/users.html" aria-current="page">Users</a><a href="/admin/organizers.html">Organizers</a><a href="/admin/judges.html">Judges</a><a href="/admin/events.html">Events</a><a href="/admin/registrations.html">Registrations</a><a href="/admin/reports.html">Reports</a><a href="/admin/audit-logs.html">Audit logs</a><a href="/admin/settings.html">Settings</a></nav>
    </header>
    <main class="admin-main">
      <section class="admin-intro"><p class="eyebrow"><span class="eyebrow-dot"></span> Administration</p><h1>Account <span>roles.</span></h1><p>Search accounts and provision organizer, judge, or admin access.</p></section>
      <section class="admin-panel">
        <form id="user-filters" class="admin-filters">
          <label for="user-search">Search accounts</label><input id="user-search" type="search" maxlength="120" placeholder="Name or email">
          <label for="role-filter">Role</label><select id="role-filter"><option value="">All roles</option><option value="student">Student</option><option value="organizer">Organizer</option><option value="judge">Judge</option><option value="admin">Admin</option></select>
          <button type="submit" class="admin-button">Search</button>
        </form>
        <div id="admin-message" class="admin-message" role="status" aria-live="polite">Loading accounts…</div>
        <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Action</th></tr></thead><tbody id="users-body"></tbody></table></div>
      </section>
    </main>
    <footer class="site-footer"><a class="brand footer-brand" href="/"><span class="brand-mark" aria-hidden="true">C</span><span>campus<span class="brand-accent">connect</span></span></a><p>Big ideas have a place here.</p><span>© <span data-current-year></span> CampusConnect</span></footer>
  </body>
</html>
