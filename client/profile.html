<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="description" content="Update your CampusConnect student profile.">
    <title>My profile — CampusConnect</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/profile.css">
    <script src="/js/pages/profile.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="CampusConnect home">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>campus<span class="brand-accent">connect</span></span>
      </a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="/events.html">Discover events</a>
        <a href="/calendar.html">Calendar</a>
        <a href="/team.html">Teams</a>
        <a href="/dashboard.html">My events</a>
        <a href="/organizer/dashboard.html">Organizer</a>
        <a href="/profile.html" aria-current="page">Profile</a>
      </nav>
    </header>

    <main class="profile-main">
      <section class="profile-card" aria-labelledby="profile-title">
        <p class="eyebrow"><span class="eyebrow-dot"></span> Your account</p>
        <h1 id="profile-title">Student <span>profile.</span></h1>
        <p class="profile-intro">Keep your CampusConnect details up to date.</p>
        <div id="profile-message" class="profile-message" role="status" aria-live="polite" hidden></div>

        <form id="profile-form" hidden>
          <label class="profile-field" for="display-name">
            <span>Display name</span>
            <input id="display-name" name="displayName" type="text" autocomplete="name" maxlength="120" required>
          </label>
          <label class="profile-field" for="email">
            <span>Email address</span>
            <input id="email" name="email" type="email" readonly>
          </label>
          <div class="profile-role">
            <span>Account role</span>
            <strong id="role"></strong>
          </div>
          <button id="save-profile" class="profile-submit" type="submit">Save changes</button>
        </form>

        <div id="profile-actions" class="profile-actions" hidden>
          <a class="profile-secondary" href="/dashboard.html">My events</a>
          <a id="role-workspace-link" class="profile-secondary" href="/admin/dashboard.html" hidden>Admin workspace</a>
          <button id="logout-button" class="profile-signout" type="button">Sign out</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <a class="brand footer-brand" href="/">
        <span class="brand-mark" aria-hidden="true">C</span>
        <span>campus<span class="brand-accent">connect</span></span>
      </a>
      <p>Big ideas have a place here.</p>
      <span>© <span data-current-year></span> CampusConnect</span>
    </footer>
  </body>
</html>
