services:
  - type: web
    name: campusconnect
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: EVENTS_DATA_SOURCE
        value: postgres
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
